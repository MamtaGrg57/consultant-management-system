<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add User - Consultant Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            💼 Consultant Management System
        </a>

        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/users" class="btn btn-info me-2">
                User Management
            </a>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold mb-4">
                        Add New User
                    </h2>

                    <form th:action="@{/users/save}"
                          th:object="${user}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <!-- Username -->
                        <div class="mb-3">

                            <label for="username"
                                   class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   id="username"
                                   th:field="*{username}"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>

                        </div>


                        <!-- Role -->
                        <div class="mb-4">

                            <label for="role"
                                   class="form-label">
                                Role
                            </label>

                            <select id="role"
                                    th:field="*{role}"
                                    class="form-select"
                                    required>

                                <option value="">Select Role</option>
                                <option value="ADMIN">ADMIN</option>
                                <option value="USER">USER</option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Save User
                            </button>

                            <a href="/users"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
