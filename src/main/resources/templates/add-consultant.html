<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Consultant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            💼 Consultant Management System
        </a>


        <div>

            <a href="/" class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/add" class="btn btn-warning">
                + Add Consultant
            </a>

        </div>

    </div>

</nav>



<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-md-7">


            <div class="card shadow border-0">


                <div class="card-body p-4">


                    <h2 class="text-center fw-bold mb-4">
                        👨‍💻 Add Consultant
                    </h2>



                    <form th:action="@{/save}"
                          th:object="${consultant}"
                          method="post">


                        <input type="hidden"
                               th:field="*{id}">



                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter full name"
                                   th:field="*{name}">


                            <div th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"
                                 class="text-danger">
                            </div>

                        </div>




                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter email address"
                                   th:field="*{email}">


                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"
                                 class="text-danger">
                            </div>

                        </div>





                        <!-- Phone -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Phone
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter phone number"
                                   th:field="*{phone}">


                            <div th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"
                                 class="text-danger">
                            </div>

                        </div>





                        <!-- Technology -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Technology
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Example: Java Spring Boot"
                                   th:field="*{technology}">


                            <div th:if="${#fields.hasErrors('technology')}"
                                 th:errors="*{technology}"
                                 class="text-danger">
                            </div>

                        </div>





                        <!-- Experience -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Experience (Years)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   placeholder="Enter years of experience"
                                   th:field="*{experience}">


                            <div th:if="${#fields.hasErrors('experience')}"
                                 th:errors="*{experience}"
                                 class="text-danger">
                            </div>

                        </div>





                        <div class="text-center">


                            <button type="submit"
                                    class="btn btn-success px-4 me-2">
                                💾 Save Consultant
                            </button>


                            <a href="/"
                               class="btn btn-outline-secondary px-4">
                                Back
                            </a>


                        </div>



                    </form>


                </div>


            </div>


        </div>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
